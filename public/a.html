<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v5 Fully Randomized Start: Cinematic Elastic Slider</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #090d16;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .slider-container {
            position: relative;
            width: 800px;
            height: 500px;
            max-width: 90vw;
            max-height: 70vh;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            background: #111827;
        }

        .slide-track {
            display: flex;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.95) blur(0px);
            transition: filter 1.4s cubic-bezier(0.25, 1, 0.35, 1.25);
        }

        .slide.motion-blur {
            filter: brightness(0.9) blur(3px);
        }

        .slide.active-focus {
            filter: brightness(1) blur(0px);
        }
    </style>
</head>
<body>

    <div class="slider-container" id="slider">
        <div class="slide-track" id="slideTrack"></div>
    </div>

    <script>
        // Your raw source images
        const baseImages = [];
        for (let i = 1; i <= 11; i++) {
            baseImages.push(`assets/library_images/img (${i}).jpg`);
        }

        const slideTrack = document.getElementById('slideTrack');
        
        // Infinite loop setup: [Last, 1, 2, 3, First]
        const images = [baseImages[baseImages.length - 1], ...baseImages, baseImages[0]];
        
        let currentIndex = 1; 
        let slideElements = [];
        let isAnimating = false;

        function initSlider() {
            // Randomize the initial starting slide index between 1 and baseImages.length on every refresh!
            const randomBaseIndex = Math.floor(Math.random() * baseImages.length);
            currentIndex = randomBaseIndex + 1;

            images.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = `slide ${index === currentIndex ? 'active-focus' : ''}`;
                img.alt = `Slide ${index}`;
                slideTrack.appendChild(img);
                slideElements.push(img);
            });

            // Position track instantly to the random start index without animation
            slideTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        function getNextRandomIndex() {
            let nextIndex;
            const realCurrentIndex = currentIndex; 
            do {
                nextIndex = Math.floor(Math.random() * baseImages.length) + 1;
            } while (nextIndex === realCurrentIndex && baseImages.length > 1);
            return nextIndex;
        }

        function updateView(targetIndex) {
            if (isAnimating) return;
            isAnimating = true;

            slideElements.forEach(slide => slide.classList.add('motion-blur'));

            slideTrack.style.transition = 'transform 1.4s cubic-bezier(0.25, 1, 0.35, 1.25)';

            const direction = targetIndex > currentIndex ? 1 : -1;
            const overTravelOffset = (targetIndex * 100) + (direction * 30); 

            slideTrack.style.transform = `translateX(-${overTravelOffset}%)`;

            setTimeout(() => {
                slideTrack.style.transform = `translateX(-${targetIndex * 100}%)`;
                currentIndex = targetIndex;

                slideElements.forEach((slide, idx) => {
                    slide.classList.toggle('active-focus', idx === currentIndex);
                    slide.classList.remove('motion-blur');
                });

                setTimeout(() => {
                    if (currentIndex === 0) {
                        slideTrack.style.transition = 'none';
                        currentIndex = baseImages.length;
                        slideTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
                    } 
                    else if (currentIndex === images.length - 1) {
                        slideTrack.style.transition = 'none';
                        currentIndex = 1;
                        slideTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
                    }

                    isAnimating = false;
                }, 900);

            }, 1000);
        }

        function moveSlide() {
            const nextRandom = getNextRandomIndex();
            updateView(nextRandom);
        }

        // Initialize on load
        initSlider();

        // Auto-play interval
        setInterval(() => {
            if (!isAnimating) {
                moveSlide();
            }
        }, 6000);
    </script>
</body>
</html>
