<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.setAttribute('data-theme', 'dark'); }

        if (localStorage.getItem('cachedAuthState') === 'true') {
            document.documentElement.classList.add('auth-cached-logged-in');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE-CAPS - Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/project-list.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/secondary-header.css">
    <link rel="stylesheet" href="css/rag-styles.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-container">
                    <img src="assets/logo.png" alt="RE-CAPS Logo" class="logo-img">

                <div class="nav-container">

                                </path>
                            </svg>
                        </button>

                        <!-- About button - shown when logged out -->
                      <a href="about_page.html" class="nav-link" id="about-nav-link">About</a>
                        <a href="#" class="nav-link" id="login-nav-link">Login</a>
                        <!-- Profile Dropdown - shown only when logged in -->
                        <div class="profile-dropdown-wrapper" id="profile-link" style="display: none;">
                            <div class="profile-img-trigger" id="profile-img-trigger" role="button" aria-haspopup="true"
                                aria-expanded="false">
                                <img id="profile-img"
                                    src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23cbd5e1'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>"
                                    alt="Profile">
                            </div>

                            <div class="profile-dropdown-panel" id="profile-dropdown-panel">
                                <!-- Avatar -->
                                <div class="pd-avatar">
                                    <img id="pd-avatar-img"
                                        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23cbd5e1'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>"
                                        alt="Profile">
                                </div>

                                <div class="pd-divider"></div>

                                <!-- Dashboard Row -->
                                <div class="pd-row" id="pd-dashboard-row" style="cursor:pointer;">
                                    <span class="pd-row-label">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="3" y="3" width="7" height="7"></rect>
                                            <rect x="14" y="3" width="7" height="7"></rect>
                                            <rect x="14" y="14" width="7" height="7"></rect>
                                            <rect x="3" y="14" width="7" height="7"></rect>
                                        </svg>
                                        Dashboard
                                    </span>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4">
                                        <polyline points="9 18 15 12 9 6"/>
                                    </svg>
                                </div>

                                <div class="pd-divider"></div>

                                <!-- About Row -->
                                <div class="pd-row" id="pd-about-row" style="cursor:pointer;" onclick="window.location.href='about_page.html'">
                                    <span class="pd-row-label">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"/>
                                            <line x1="12" y1="8" x2="12" y2="12"/>
                                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                                        </svg>
                                        About
                                    </span>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4">
                                        <polyline points="9 18 15 12 9 6"/>
                                    </svg>
                                </div>

                                <div class="pd-divider"></div>

                                <!-- Theme Toggle Row -->
                                <div class="pd-row">
                                    <span class="pd-row-label">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" viewBox="0 0 16 16">
                                            <path
                                                d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708" />

                                <div class="pd-logout-row">
                                    <button class="pd-logout-btn" id="pd-logout-btn">

                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <!-- Secondary Sticky Header -->
    <nav class="secondary-header" aria-label="Secondary navigation">
        <div class="secondary-header-container">
            <a href="index.html" class="nav-item" data-page="index">
                <span class="nav-label">Home</span>
            </a>
            <a href="view_project_details.html" class="nav-item" data-page="project-detail" style="display: none;">
                <span class="nav-label">Project Detail</span>
            </a>
            <a href="chatbot.html" class="nav-item" data-page="ai-chatbot">
                <span class="nav-label">AI Chatbot</span>
            </a>
        </div>
    </nav>

    <main>
        <section class="search-section">
            <div class="container">
                <div class="search-container">
                    <h1 class="search-title">Find Your Next Research Breakthrough</h1>
                    <p class="search-subtitle">Search thousands of capstone projects from CTU Daanbantayan Campus</p>

                    <div class="search-bar-wrapper">
                        <div class="search-bar">
                            <input type="text" class="search-input"
                                placeholder="Try: &quot;projects about machine learning in agriculture&quot; or &quot;IoT systems for monitoring&quot;">
                            <button class="search-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.3-4.3"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="search-options">
                        <label class="ai-search-toggle">
                            <input type="checkbox" class="ai-toggle-input">
                            <span class="ai-toggle-slider"></span>
                            <span class="ai-toggle-label">AI Semantic Search</span>
                            <span class="ai-badge">AI</span>
                        </label>
                    </div>

                    <div class="search-actions"
                        style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
                    </div>
                </div>

                <!-- Decorative elements -->
                <div class="deco-circle deco-circle-1"></div>
                <div class="deco-circle deco-circle-2"></div>
                <div class="deco-blob"></div>
            </div>
        </section>

        <section class="projects-list-section" style="padding: 4rem 5%; background-color: var(--background);">
            <div class="container" style="max-width: 1200px; margin: 0 auto;">
                <div class="projects-header-bar">
                    <h2 class="section-title" style="margin: 0;">Total Projects: <span
                            id="total-projects-count">...</span></h2>
                    <div class="header-controls"
                        style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                        <div class="sort-control dropdown">
                            <button class="sort-toggle-btn" id="sort-toggle-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <polyline points="19 12 12 19 5 12"></polyline>
                                </svg>
                                Sort Projects
                            </button>
                            <div class="sort-dropdown-menu" id="sort-dropdown-menu">
                                <div class="sort-group">
                                    <div class="sort-group-title">Sort By</div>
                                    <label class="sort-radio-label">
                                        <input type="radio" name="sortField" value="createdAt" checked>
                                        <span class="radio-custom"></span>
                                        Date Created
                                    </label>
                                    <label class="sort-radio-label">
                                        <input type="radio" name="sortField" value="title">
                                        <span class="radio-custom"></span>
                                        Title
                                    </label>
                                    <label class="sort-radio-label">
                                        <input type="radio" name="sortField" value="adviser">
                                        <span class="radio-custom"></span>
                                        Adviser
                                    </label>
                                    <label class="sort-radio-label">
                                        <input type="radio" name="sortField" value="updatedAt">
                                        <span class="radio-custom"></span>
                                        Date Updated
                                    </label>
                                    <label class="sort-radio-label">
                                        <input type="radio" name="sortField" value="authorsCount">
                                        <span class="radio-custom"></span>
                                        Authors Length (Count)
                                    </label>
                                </div>
                                <div class="sort-divider"></div>
                                <div class="sort-group">
                                    <div class="sort-group-title">Order</div>
                                    <label class="sort-radio-label">
                                        <input type="radio" name="sortOrder" value="desc" checked>
                                        <span class="radio-custom"></span>
                                        Descending
                                    </label>
                                    <label class="sort-radio-label">
                                        <input type="radio" name="sortOrder" value="asc">
                                        <span class="radio-custom"></span>
                                        Ascending
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="view-toggles">
                            <button class="view-btn active" data-view="list" title="List View">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <line x1="8" y1="6" x2="21" y2="6"></line>
                                    <line x1="8" y1="12" x2="21" y2="12"></line>
                                    <line x1="8" y1="18" x2="21" y2="18"></line>
                                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                                </svg>
                            </button>
                            <button class="view-btn" data-view="grid" title="Grid View">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect x="3" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="14" width="7" height="7"></rect>
                                    <rect x="3" y="14" width="7" height="7"></rect>
                                </svg>
                            </button>
                            <button class="view-btn" data-view="compact" title="Compact View">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <line x1="4" y1="6" x2="20" y2="6"></line>
                                    <line x1="4" y1="12" x2="20" y2="12"></line>
                                    <line x1="4" y1="18" x2="20" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="projects-container" class="projects-container">
                    <div class="loading-text">Loading projects...</div>
                </div>
                <div id="pagination-container" class="pagination-container"></div>
            </div>
        </section>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <h2 class="modal-title">Login to RE-CAPS</h2>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="login-email" class="form-input" placeholder="your@email.com">
                <div class="field-error" id="email-error"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••">
                    <button type="button" class="toggle-password-btn" data-target="login-password"
                        aria-label="Toggle password visibility">
                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" width="20" height="20">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" width="20" height="20" style="display: none;">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <div class="field-error" id="password-error"></div>
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember-me" class="checkbox-input">
                    <span class="checkbox-custom"></span>
                    Remember me
                </label>
            </div>

            <div class="login-buttons-row">
                <button id="login-btn" class="btn btn-primary btn-flex">Login</button>
                <button type="button" id="google-login-btn" class="btn-google btn-icon" title="">
                    <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24"
                        height="24">
                        <path fill="#FFC107"
                            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z">
                        </path>
                        <path fill="#FF3D00"
                            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z">
                        </path>
                        <path fill="#4CAF50"
                            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z">
                        </path>
                        <path fill="#1976D2"
                            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z">
                        </path>
                    </svg>
                </button>
            </div>

            <br>
            <p style="font-size: small; text-align: center;">Don't have an account? <a href="account_registration.html"
                    style="color: #4a8fd8">Register here</a></p>

            <button class="modal-close">&times;</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script src="js/toast.js"></script>
    <script src="js/main.js"></script>
    <script src="js/theme-toggle.js"></script>

    <script src="js/smooth-scroll.js"></script>

    <!-- RAG Service for AI Semantic Search -->
    <script src="RAG/rag-service.js"></script>
    
    <script src="js/project-list.js"></script>
    <script src="js/search-handler.js"></script>
    <script src="js/secondary-header.js"></script>

</html>
